[file_names_and_paths]
; Output model filename
model_name = ResNet18_Transformer
; Path to the dataset folder (containing the h5py files)
dataset_folder = data/ptbxl/

[encoder_parameters]
; Number of blocks in the encoder (18 or 34)
num_blocks = 18
; Kernel sizes for the convolutional layers
kernel_size = [9, 7, 7, 5]
; Kernel size for the initial stem layer
stem_kernel_size = 9
; Size of the encoded ECG feature vector (temporal features)
encoded_ecg_size = 1
; Dimension of the encoder output tokens (D)
encoder_dim = 512
; Tokens emitted per lead; total ECG tokens = 12 * this + 1 global token
ecg_tokens_per_lead = 1
; SSL pre-trained model path (leave empty or set to None to use standard ResNet)
ssl_pretrained_path = 
; SSL ECG model type (e.g., resnet50, vit_tiny_ecg) - only used if ssl_pretrained_path is set
ssl_ecg_model = vit_tiny


[decoder_parameters]
; Number of layers in the Transformer decoder
num_layers = 12
; Number of attention heads in each Transformer layer
num_heads = 8
; Whether to include bias in the linear transformations
bias = True
; Dimension of word embeddings
emb_dim = 512
; Dropout rate for regularization
dropout = 0.5
; Whether there is a special start token in input sequences
start_token = True

[training_parameters]
; Number of samples per     
batch_size = 32
; Maximum number of epochs for training (if early stopping is not triggered)
epochs = 200
; Stop training if no improvement in validation metrics for this many epochs
early_stopping_trigger = 30
; Epoch to start training from (useful for resuming training)
start_epoch = 0
; Path to a checkpoint to resume from (leave empty to start fresh)
#./BEST_checkpoint_ResNet18_Transformer_TEST_METEOR-0.588.pth.tar
resume_checkpoint =
; Learning rate for the encoder
encoder_lr = 4e-4
; Learning rate for the decoder
decoder_lr = 1e-4
; Maximum absolute value for gradient clipping
grad_clip = 5.
; Frequency of printing training/validation stats (in batches)
print_freq = 1500
; Number of top predictions to consider during evaluation
top_k = 1
; Enable sanity checks for debugging purposes
sanity_check = False
; Normalize the dataset (if True)
normalize_ds = False
; Whether to remove the start token from sequences (if exists)
remove_start_token = False
; Adjust learning rate after this many epochs with no improvement
adjust_learning_rate_after = 8
; Whether to enable debug mode, which will stop training after one epoch for faster processing
debug_mode = False
; --- Clinical prompt from MERL-predicted labels (predict-then-generate) ---
use_merl_labels = true
; Path to the pretrained MERL (ECGCLIP) checkpoint
merl_checkpoint =
; MERL zero-shot prompt file (defaults to MERL-ICML2024/zeroshot/CKEPE_prompt.json)
merl_prompt_json =
; MERL ECG backbone used by the checkpoint (vit_tiny / resnet18 / resnet34 ...)
merl_ecg_model = resnet18
; Sigmoid score threshold for calling a label active
merl_threshold = 0.5
