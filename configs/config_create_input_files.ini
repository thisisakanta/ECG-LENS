[file_names_and_paths]
; Folder containing the PTB-XL database csv + records100/ + records500/
ecg_folder = data/ptbxl
; Where TRAIN/VAL/TEST_DATASET.hdf5 and encoder.pkl are written
output_folder = data/ptbxl

[file_creation_params]
; 100 -> records100 (1000 samples), 500 -> records500 (5000 samples)
sampling_rate = 500
; Apply rule-based clinical-term normalization to reports
replace_abbr_text = True
; Minimum word frequency to enter the vocabulary
min_word_freq = 3
; Maximum vocabulary size (excluding special tokens)
vocab_size = 5000
; Maximum caption length in tokens (incl. start/end); used to pad
max_len = 64
; Whether reports are translated/refined (uses report_en if present)
translate_comments = True
; Split strategy: 'strat_fold' -> folds<9 train, 9 val, 10 test
split_method = strat_fold
; Stop early after a few records for a quick smoke test
debug_mode = False
